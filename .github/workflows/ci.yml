name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: &gh
          GH_TOKEN: ${{ github.token }}
        run: &install |
          tag=$(gh release view -R conn3xorg/conn3x --json tagName -q .tagName)
          file="conn3x_${tag#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/$file"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$file" -C bin conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: conn3x version
      - run: conn3x fmt -check -recursive
      - name: Validate
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the example
        working-directory: examples/local
        run: conn3x init -backend=false && conn3x validate

  e2e:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Fedora is left out: its openldap-servers can't load its own core
        # schema. See the README.
        distro: [rocky10, ubuntu2404, debian13, debian12, rocky9]
    name: e2e (${{ matrix.distro }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test host images live in the Conn3x repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/conn3x
          ref: main
          path: conn3x
          persist-credentials: false
          sparse-checkout: test/images
      - name: Install Conn3x
        env: *gh
        run: *install
      - name: Start the ${{ matrix.distro }} host
        working-directory: examples/local
        env:
          # Conn3x has no Debian 12 or Rocky Linux 9 test images, so those
          # live here.
          CONTAINERFILE: ${{ github.workspace }}/${{ (matrix.distro == 'debian12' || matrix.distro == 'rocky9') && 'test/images' || 'conn3x/test/images' }}/${{ matrix.distro }}/Containerfile
          # Rootless, Rocky Linux 9's sshd refused root at PAM on GitHub's
          # runners. Rootful, it lets root in.
          PODMAN: sudo podman
        run: ./up.sh
      - name: Apply, then plan again with no changes
        working-directory: examples/local
        env:
          TF_VAR_root_password: ci-only-root-pass-1
        run: |
          conn3x init
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
      # The example's secrets reach the host write-only, so state holds
      # none of them, and nothing Conn3x writes under .terraform does either.
      # .terraform/modules is left out: it holds downloaded module code.
      - name: Check the secrets stay out of state
        working-directory: examples/local
        run: |
          if grep -rqF --exclude-dir=modules -e ci-only-root-pass-1 terraform.tfstate .terraform/; then
            echo "A secret from the example is in terraform.tfstate or under .terraform/." >&2
            exit 1
          fi
      # The root DN finds the base, an OU and the example's entries, an
      # anonymous search and a wrong password are refused, and cn=config
      # holds only a hash of the password.
      - name: Search as the root DN, and check anonymous access is refused
        run: &check |
          sudo podman exec -i circuit-openldap sh -eu <<'EOF'
          b=dc=example,dc=test
          search() { ldapsearch -x -LLL -H ldap://127.0.0.1:389 -D "cn=admin,$b" -w ci-only-root-pass-1 "$@"; }
          systemctl is-active slapd
          search -b "$b" -s base dn | grep -qx "dn: $b"
          search -b "ou=people,$b" -s base dn | grep -qx "dn: ou=people,$b"
          search -b "ou=people,$b" "(uid=ada)" cn | grep -qx "cn: Ada Lovelace"
          search -b "$b" "(cn=engineers)" member | grep -qx "member: uid=ada,ou=people,$b"
          if ldapsearch -x -LLL -H ldap://127.0.0.1:389 -b "$b" -s base dn >/dev/null 2>&1; then exit 1; fi
          if ldapsearch -x -LLL -H ldap://127.0.0.1:389 -D "cn=admin,$b" -w wrong-password-1 -b "$b" -s base dn >/dev/null 2>&1; then exit 1; fi
          grep -q "^olcRootPW:: " /etc/*ldap/slapd.d/cn=config/olcDatabase=\{1\}mdb.ldif
          if grep -rq ci-only-root-pass-1 /etc/*ldap/slapd.d; then exit 1; fi
          EOF
      - name: Restart the host, then check the data is still there
        run: |
          sudo podman restart circuit-openldap
          sudo podman exec circuit-openldap timeout 60 systemctl is-system-running --wait || true
          # A slow boot can end that wait with slapd still starting.
          sudo podman exec circuit-openldap timeout 60 sh -c 'until systemctl is-active -q slapd; do sleep 1; done'
      - name: Search again after the restart
        run: *check
      # A fresh host gets the last release, then this checkout is applied
      # over it, the way someone raises the module's ref. v0.2.0 couldn't
      # start slapd on Debian 12, so that one has nothing to upgrade from.
      - name: Upgrade from circuit-openldap v0.2.0 on a fresh host, then plan again with no changes
        if: matrix.distro != 'debian12'
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/${{ matrix.distro == 'rocky9' && 'test/images' || 'conn3x/test/images' }}/${{ matrix.distro }}/Containerfile
          PODMAN: sudo podman
          TF_VAR_root_password: ci-only-root-pass-1
        run: |
          ./down.sh
          ./up.sh
          sed -i 's|source = "../.."|source = "github.com/conn3xorg/circuit-openldap?ref=v0.2.0"|' main.tf
          grep -q 'ref=v0.2.0' main.tf
          conn3x init
          conn3x apply -auto-approve
          git checkout -- main.tf
          conn3x init
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
      - name: Search again after the upgrade
        if: matrix.distro != 'debian12'
        run: *check
      - name: Clean up
        if: always()
        working-directory: examples/local
        env:
          PODMAN: sudo podman
        run: ./down.sh
